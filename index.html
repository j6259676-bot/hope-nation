        h += '<button onclick="schedToggleFixedSession(\'' + s + '\')" style="flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid;' + (on ? 'background:var(--teal);color:#FFF;border-color:var(--teal);' : 'background:#FDFCF9;color:var(--muted);border-color:var(--border);') + '">' + s + '</button>';
      });
      h += '</div></div>';

      // ── 整期都不能（發布後隱藏，避免批次覆蓋已公布的 Final）──
      if (!period.published) {
        h += '<button onclick="schedUnavailableAll()" style="width:100%;padding:11px;background:none;border:1.5px dashed #E5998A;border-radius:12px;color:#C05040;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px">本期全部都不能服事</button>';
      }

      // ── 週卡片（每週角色各自選）──
      schedGroupByWeek(slots).forEach(function(week, wi) {
        const weekSlots = week.slots.filter(function(s) { return showSessions.indexOf(s.session) >= 0; });
        if (!weekSlots.length) return;
        const filled = weekSlots.every(function(s) { const e = schedLocalEntries[s.date+'|'+s.session]; return e && e.status; });
        const hasAvail = weekSlots.some(function(s) { const e = schedLocalEntries[s.date+'|'+s.session]; return e && (e.status === 'available' || e.status === 'assigned'); });
        h += '<div class="card" style="margin-bottom:8px;padding:14px">';
        h += '<div style="display:flex;align-items:center;margin-bottom:10px"><div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + (filled ? '#4CAF7D' : 'var(--border)') + ';margin-right:8px"></div><div style="font-size:15px;font-weight:700">第 ' + (wi+1) + ' 週<span style="font-weight:400;color:var(--muted);font-size:13px"> · ' + schedFmtDate(week.date) + '（日）</span></div></div>';
        const multiSlot = weekSlots.length > 1;
        h += '<div style="display:flex;gap:8px;margin-bottom:' + (hasAvail ? '10px' : '0') + '">';
        weekSlots.forEach(function(slot) {
          const e = schedLocalEntries[slot.date+'|'+slot.session];
          // 排班意願只反映「我自己選的」狀態，不受管理者指派角色影響（指派只顯示在上方「我這期的服事」）
          const avail = e && (e.status==='available' || e.status==='assigned');
          const unavail = e && (e.status==='unavailable_all' || e.status==='unavailable');
          const changeReq = e && e.status==='change_requested';
          // 狀態文字：可服事 / 休息 / 申請中 / 未填
          let stateText, chipStyle;
          if (changeReq) {
            stateText = '申請中';
            chipStyle = 'background:#FFF4E0;color:#B26A00;border-color:#F0B860;';
          } else if (avail) {
            stateText = '可服事';
            chipStyle = 'background:var(--yellow);color:var(--black);border-color:var(--yellow);';
          } else if (unavail) {
            stateText = '休息';
            chipStyle = 'background:#FEF0ED;color:#C05040;border-color:#E5998A;';
          } else {
            stateText = '未填';
            chipStyle = 'background:#FDFCF9;color:#BDBDBD;border-color:#E0E0E0;font-weight:400;';
          }
          const sessionLabel = multiSlot ? '<div style="font-size:10px;opacity:0.55;margin-bottom:1px">' + slot.session + '</div>' : '';
          h += '<button onclick="schedChipClick(\'' + slot.date + '\',\'' + slot.session + '\')" style="flex:1;padding:10px 0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid;min-height:46px;line-height:1.3;' + chipStyle + '">' + sessionLabel + '<div>' + stateText + '</div></button>';
        });
        h += '</div>';
        // 角色 chip（每週 × 每場獨立統計）
        if (hasAvail) {
          const takenRoles = schedViewData.takenRoles || {};
          h += '<div style="margin-top:8px">';
          h += '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">預設接待 Host · 也能擔任以下特殊角色再勾選（選填）</div>';
          weekSlots.forEach(function(slot) {
            const e = schedLocalEntries[slot.date+'|'+slot.session];
            if (!e || (e.status !== 'available' && e.status !== 'assigned')) return;
            const cellKey = slot.date + '|' + slot.session;
            const cellTaken = takenRoles[cellKey] || {};
            const slotRoles = (e.roles && e.roles.length) ? e.roles : [];
            h += multiSlot ? '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">' + slot.session + '</div>' : '';
            h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:' + (multiSlot ? '10px' : '0') + '">';
            openRoles.forEach(function(role) {
              const mySelected = slotRoles.indexOf(role) >= 0;
              const otherCount = cellTaken[role] || 0;
              let chipStyle, chipLabel;
              if (mySelected) {
                chipStyle = 'background:var(--teal);color:#FFF;border-color:var(--teal);';
                chipLabel = role + (otherCount ? ' +' + otherCount : '');
              } else if (otherCount > 0) {
                chipStyle = 'background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7;';
                chipLabel = role + ' ✓';
              } else {
                chipStyle = 'background:#FFF;color:var(--muted);border-color:var(--border);';
                chipLabel = role;
              }
              h += '<button onclick="schedToggleRole(\'' + slot.date + '\',\'' + slot.session + '\',\'' + role + '\')" style="padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid;' + chipStyle + '">' + chipLabel + '</button>';
            });
            h += '</div>';
          });
          h += '</div>';
        }
        h += '</div>';
      });

      // ── 確認送出按鈕（醒目 CTA，狀態：可送出 / 送出中 / 已送出）──
      const availCount = Object.keys(schedLocalEntries).filter(function(k) { const e = schedLocalEntries[k]; return e && (e.status === 'available' || e.status === 'assigned'); }).length;
      let submitBg = 'var(--teal)', submitIcon = lucide('check-circle', 20), submitLabel;
      if (schedSubmitState === 'sending') { submitLabel = '送出中…'; submitIcon = ''; }
      else if (schedSubmitState === 'done') { submitBg = '#2E7D32'; submitLabel = '已送出，感謝你！'; }
      else { submitLabel = availCount ? '確認送出（' + availCount + ' 個場次可服事）' : '確認送出'; }
      h += '<div style="font-size:11px;color:var(--muted);text-align:center;margin:16px 0 6px">你的選擇會自動儲存，按下方按鈕確認送出</div>';
      h += '<button id="schedSubmitBtn" onclick="schedCompleteFill()" style="width:100%;padding:16px;background:' + submitBg + ';color:#FFF;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 10px rgba(29,41,46,.18)">' + submitIcon + '<span>' + submitLabel + '</span></button>';
      return h;
    }

    function renderSchedMineView() {
      const assigned = [];
      (schedViewData.slots || []).forEach(function(slot) {
        const e = schedLocalEntries[slot.date+'|'+slot.session];
        if (e && (e.adminRole || (e.status==='assigned' && e.roles && e.roles.length))) assigned.push({ date: slot.date, session: slot.session, adminRole: e.adminRole||'', roles: e.roles||[] });

      }).join('');
    }

    function renderSchedAdminStaff() {
      let h = '';
      // 新增輸入列
      h += '<div class="card" style="margin-bottom:12px"><div style="font-size:14px;font-weight:700;margin-bottom:10px">新增服事夥伴</div>';
      h += '<div style="display:flex;gap:8px"><input class="input" id="schedAddStaffInput" type="text" placeholder="輸入姓名..." value="' + esc(schedAddStaffInput) + '" oninput="schedAddStaffInput=this.value" style="flex:1;margin-bottom:0" onkeydown="if(event.key===\'Enter\')schedDoAddStaff()"><button onclick="schedDoAddStaff()" style="padding:10px 16px;background:var(--teal);color:#FFF;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap">新增</button></div></div>';

      if (schedStaffLoading) {
        h += '<div style="text-align:center;padding:32px;color:var(--muted)">載入中…</div>';

        h += '<div style="text-align:center;padding:32px;color:var(--muted)">點上方「新增」或等待載入…</div>';
      } else if (!schedStaffList.length) {
        h += '<div class="card" style="text-align:center;color:var(--muted);padding:32px">名單是空的，先新增服事夥伴</div>';

        const sortByName = function(a, b) { return a.name.localeCompare(b.name, 'zh-TW'); };
        const allActive = schedStaffList.filter(function(s) { return s.status !== 'inactive'; }).sort(sortByName);
        const inactive = schedStaffList.filter(function(s) { return s.status === 'inactive'; }).sort(sortByName);

        // ── 場次篩選 tab（點 6）──
        const filterOpts = ['全部','9:30','11:30','2:00','跨場','未分場'];
        const sessOf = function(s) { return s.homeSession ? s.homeSession : '未分場'; };
        h += '<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px">';
        filterOpts.forEach(function(f) {
          const n = f === '全部' ? allActive.length : allActive.filter(function(s){ return sessOf(s) === f; }).length;
          const on = schedStaffSessionFilter === f;
          h += '<button onclick="schedSetStaffFilter(\'' + f + '\')" style="flex:0 0 auto;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;' + (on ? 'background:var(--black);color:var(--yellow);border-color:var(--black);' : 'background:#FFF;color:var(--muted);border-color:var(--border);') + '">' + f + ' ' + n + '</button>';
        });
        h += '</div>';

        const active = schedStaffSessionFilter === '全部' ? allActive : allActive.filter(function(s){ return sessOf(s) === schedStaffSessionFilter; });
        h += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + (schedStaffSessionFilter === '全部' ? '共 ' + active.length + ' 位在職服事夥伴' : schedStaffSessionFilter + '：' + active.length + ' 位') + '</div>';
        const sessOptsJs = ['','9:30','11:30','2:00','跨場'];
        active.forEach(function(s) {
          const cur = s.homeSession || '';
          let sel = '<select onchange="schedSetStaffSession(' + s.rowIndex + ',this.value)" style="border:1.5px solid var(--border);border-radius:8px;padding:5px 6px;font-size:12px;color:var(--teal);background:#FFF;cursor:pointer">';
          sessOptsJs.forEach(function(o) {
            sel += '<option value="' + o + '"' + (o === cur ? ' selected' : '') + '>' + (o === '' ? '未分場' : o) + '</option>';
          });
          sel += '</select>';
          h += '<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;background:#FDFCF9">';
          h += '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">' + esc(s.name) + '</div>' + (s.note ? '<div style="font-size:12px;color:var(--muted)">' + esc(s.note) + '</div>' : '') + '</div>';
          h += sel;
          h += '<button onclick="schedToggleStaff(' + s.rowIndex + ',\'inactive\')" style="padding:5px 10px;background:none;border:1.5px solid #E5998A;border-radius:8px;color:#C05040;font-size:12px;cursor:pointer;white-space:nowrap">休息</button>';
          h += '<button onclick="schedDeleteStaff(' + s.rowIndex + ')" aria-label="刪除" title="永久刪除" style="padding:5px 7px;background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;flex-shrink:0">' + lucide('trash', 14) + '</button>';
          h += '</div>';
        });
        if (inactive.length) {
          h += '<div style="font-size:12px;color:var(--muted);margin:12px 0 8px">休息中（' + inactive.length + '）</div>';
          inactive.forEach(function(s) {
            h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border:1.5px dashed var(--border);border-radius:12px;margin-bottom:8px;opacity:0.6"><div style="font-size:14px;color:var(--muted);flex:1;min-width:0">' + esc(s.name) + '</div><div style="display:flex;gap:6px;flex-shrink:0"><button onclick="schedToggleStaff(' + s.rowIndex + ',\'active\')" style="padding:5px 10px;background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer">復原</button><button onclick="schedDeleteStaff(' + s.rowIndex + ')" aria-label="刪除" title="永久刪除" style="padding:5px 7px;background:none;border:1.5px solid #E5998A;border-radius:8px;color:#C05040;cursor:pointer;display:inline-flex;align-items:center">' + lucide('trash', 14) + '</button></div></div>';
          });
        }
      }
      return h;
    }

    function schedLoadStaff() {
      if (!adminToken) return;
      schedStaffLoading = true;
      renderScheduleTab(document.getElementById('mainContent'));
      google.script.run
        .withSuccessHandler(function(d) {
          schedStaffLoading = false;
          schedStaffList = d && d.success ? d.staff : [];
          renderScheduleTab(document.getElementById('mainContent'));
        })
        .withFailureHandler(function(e) {
          schedStaffLoading = false;
          showToast('載入名單失敗: ' + (e.message||e));
          renderScheduleTab(document.getElementById('mainContent'));
        })
        .getStaffList(adminToken);
    }

    function schedDoAddStaff() {
      const name = schedAddStaffInput.trim();
      if (!name) { showToast('請輸入姓名'); return; }
      if (!adminToken) { showToast('請先登入管理者'); return; }
      google.script.run
        .withSuccessHandler(function(d) {
          if (d && d.success) {
            schedAddStaffInput = '';
            showToast('已新增「' + name + '」');
            schedLoadStaff();
          } else {
            showToast('新增失敗: ' + (d&&d.error||'未知錯誤'));
          }
        })
        .withFailureHandler(function(e) { showToast('新增失敗: ' + (e.message||e)); })
        .addStaffMember(name, '', adminToken);
    }

    function schedToggleStaff(rowIndex, newStatus) {
      if (!adminToken) return;
      google.script.run
        .withSuccessHandler(function(d) {
          if (d && d.success) schedLoadStaff();
          else showToast('操作失敗');
        })
        .withFailureHandler(function(e) { showToast('操作失敗: ' + (e.message||e)); })
        .setStaffStatus(rowIndex, newStatus, adminToken);
    }

    // 永久刪除服事夥伴（連同所有期別的排班紀錄）。名字由 schedStaffList 反查，避免 onclick 內字串跳脫問題。
    function schedDeleteStaff(rowIndex) {
      if (!adminToken) { showToast('請先登入管理者'); return; }
      const item = (schedStaffList || []).find(function(s){ return s.rowIndex === rowIndex; });
      const name = item ? item.name : '';
      if (!confirm('確定刪除「' + name + '」嗎？\n會一併刪除他在所有期別的排班紀錄，無法復原。\n（若只是暫時不服事，請改用「休息」。）')) return;
      showLoading();
      google.script.run
        .withSuccessHandler(function(d) {
          hideLoading();
          if (d && d.success) {
            showToast('已刪除「' + (d.name || name) + '」' + (d.removedEntries ? '（含 ' + d.removedEntries + ' 筆排班）' : ''));
            schedRosterData = null; schedOverviewData = null; // 列號變動 → 名冊/總覽快取失效
            schedLoadStaff();
          } else {
            showToast('刪除失敗: ' + (d&&d.error||'未知錯誤'));
          }
        })
        .withFailureHandler(function(e) { hideLoading(); showToast('刪除失敗: ' + (e.message||e)); })
        .deleteStaffMember(rowIndex, adminToken);
    }

    // 名單場次篩選（點 6，純前端）
    function schedSetStaffFilter(f) {
      schedStaffSessionFilter = f;
      localStorage.setItem('schedStaffSessionFilter', f);
      renderScheduleTab(document.getElementById('mainContent'));
    }

    // 設定某夥伴的主要場次（點 6）
    function schedSetStaffSession(rowIndex, session) {
      if (!adminToken) { showToast('請先登入管理者'); return; }
      // 樂觀更新本機，避免整頁重載讓 select 跳動
      if (schedStaffList) {
        const item = schedStaffList.find(function(s){ return s.rowIndex === rowIndex; });
        if (item) item.homeSession = session;
      }
      renderScheduleTab(document.getElementById('mainContent'));
      google.script.run
        .withSuccessHandler(function(r) {
          if (!r || !r.success) { showToast((r && r.error) || '設定場次失敗'); schedLoadStaff(); }
          else showToast(session ? '已設為 ' + session : '已清除場次');
        })
        .withFailureHandler(function(e) { showToast('設定失敗: ' + (e.message||e)); schedLoadStaff(); })
        .setStaffHomeSession(rowIndex, session, adminToken);
    }

    function _schedAdminTabBar_() {
      const tabs = [
        { key:'fill', label:'我的排班' },
        { key:'mine', label:'我的服事' },
        { key:'overview', label:'總覽' },
        { key:'staff', label:'管理名單' }
      ];
      let h = '<div style="display:flex;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden">';
      tabs.forEach(function(t, i) {
        const active = schedSubView === t.key;
        const border = i < tabs.length-1 ? 'border-right:1.5px solid var(--border);' : '';
        h += '<button onclick="schedSwitchView(\'' + t.key + '\')" style="flex:1;padding:10px;border:none;' + border + 'font-size:14px;font-weight:' + (active?'700':'400') + ';background:' + (active?'var(--black)':'#FFF') + ';color:' + (active?'var(--yellow)':'var(--muted)') + ';cursor:pointer">' + t.label + '</button>';
      });
      h += '</div>';
      return h;
    }

    function renderScheduleTab(el) {
      let html = '<div class="anim-fade">';
      html += '<div class="section-title">服事排班</div>';
      // Admin 可直接進入管理名單，不需先選人
      if (isAdmin && schedSubView === 'staff') {
        html += _schedAdminTabBar_();
        html += renderSchedAdminStaff();
      } else if (isAdmin && schedSubView === 'overview') {
        html += _schedAdminTabBar_();
        try { html += renderSchedAdminOverview(); }
        catch(e) { html += '<div style="color:red;padding:16px;background:#FFF5F5;border-radius:8px;margin:8px 0;font-size:12px">渲染錯誤: ' + (e.message||String(e)) + '</div>'; }
      } else if (!schedPersonRow) {
        html += renderSchedPersonPicker();
        if (isAdmin) {
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">';
          html += '<button onclick="schedSwitchView(\'overview\')" style="padding:12px;background:none;border:1.5px solid var(--border);border-radius:12px;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer">排班總覽</button>';
          html += '<button onclick="schedSwitchView(\'staff\')" style="padding:12px;background:none;border:1.5px solid var(--border);border-radius:12px;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer">管理名單</button>';
          html += '</div>';
        }
      } else {
        html += renderSchedMain();
      }
      html += '</div>';
      el.innerHTML = html;
      if (!schedPersonRow && schedSubView !== 'staff') {
        const inp = document.getElementById('schedACInput');
        if (inp && schedACInput) inp.value = schedACInput; // 還原上次輸入
        // 不自動 focus：主要互動是「直接點名字」，鍵盤彈出會蓋住名單
        _schedRenderResults_(); // 渲染名單（載入中/分組 chips/過濾結果）
      } else if (schedSubView !== 'staff' && schedSubView !== 'overview' && !schedViewData && !schedLoading) {
        schedLoadView();
      }
      if (schedSubView === 'staff' && !schedStaffList && !schedStaffLoading) schedLoadStaff();
      if (schedSubView === 'overview' && !schedOverviewData && !schedOverviewLoading) schedLoadOverview();
    }

    function schedLoadView() {
      schedLoading = true;
      renderScheduleTab(document.getElementById('mainContent'));
      google.script.run
        .withSuccessHandler(function(d) {
          schedLoading = false; schedViewData = d;
          if (d && d.entries) {
            Object.keys(d.entries).forEach(function(k) { if (!schedPending[k]) schedLocalEntries[k] = d.entries[k]; });
          }
          renderScheduleTab(document.getElementById('mainContent'));
          // admin 預抓總覽，讓「總覽」分頁的申請調整紅點主動亮（#4）
          if (isAdmin && !schedOverviewData && !schedOverviewLoading) schedLoadOverview();
        })
        .withFailureHandler(function(e) {
          schedLoading = false;
          renderScheduleTab(document.getElementById('mainContent'));
          showToast('載入失敗: ' + (e.message||e));
        })
        .getScheduleViewForUser(schedPersonRow);
    }

    // 公開名冊（點 7）：所有夥伴可看某主日各場一起服事的人
    function schedLoadRoster() {
      schedRosterLoading = true; schedRosterData = null;
      renderScheduleTab(document.getElementById('mainContent'));
      google.script.run
        .withSuccessHandler(function(d) {
          schedRosterLoading = false; schedRosterData = d || { roster: {}, slots: [] };
          renderScheduleTab(document.getElementById('mainContent'));
        })
        .withFailureHandler(function(e) {
          schedRosterLoading = false; schedRosterData = { roster: {}, slots: [] };
          renderScheduleTab(document.getElementById('mainContent'));
          showToast('載入失敗: ' + (e.message||e));
        })
        .getPublicRoster(null);
    }

    function renderSchedRoster() {
      if (schedRosterLoading) return '<div style="text-align:center;padding:40px;color:var(--muted)">載入中…</div>';
      if (!schedRosterData) { schedLoadRoster(); return '<div style="text-align:center;padding:40px;color:var(--muted)">載入中…</div>'; }
      const slots = schedRosterData.slots || [];
      const roster = schedRosterData.roster || {};
      if (!slots.length) return '<div class="card" style="text-align:center;color:var(--muted);padding:32px">目前沒有排班資料</div>';
      const byDate = {};
      slots.forEach(function(s) {
        if (schedSessionFocus !== '全部' && s.session !== schedSessionFocus) return; // 場次焦點過濾
        if (!byDate[s.date]) byDate[s.date] = []; byDate[s.date].push(s.session);
      });
      const dayNames = ['日','一','二','三','四','五','六'];
      const dates = Object.keys(byDate).sort();
      let h = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">每個主日各場一起服事的夥伴，上方是已排定角色、下方是 Host（接待）</div>';
      h += '<div class="sched-two-col">';
      dates.forEach(function(date) {
        const d = date.split('-');
        const dayOfWeek = dayNames[new Date(date + 'T00:00:00').getDay()];
        h += '<div style="margin-bottom:10px;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)">';
        h += '<div style="background:var(--black);color:var(--yellow);font-size:13px;font-weight:700;padding:9px 14px">' + parseInt(d[1]) + '/' + parseInt(d[2]) + '（' + dayOfWeek + '）</div>';
        byDate[date].forEach(function(sess, si) {
          const people = roster[date + '|' + sess] || [];
          const border = si < byDate[date].length-1 ? 'border-bottom:1px solid var(--border);' : '';
          h += '<div style="padding:10px 14px;background:#FFF;' + border + '">';
          // 場次標頭：比照管理者排班 grid（場次 + 黃色人數徽章）
          h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap"><span style="font-size:12px;font-weight:700;color:var(--muted)">' + sess + '</span><span style="background:var(--yellow);color:var(--black);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700">' + people.length + ' 人</span></div>';
          if (!people.length) {
            h += '<div style="font-size:13px;color:#BDBDBD;font-style:italic">尚無人</div>';
          } else {
            // 比照管理者排班 grid：「已排定」（角色徽章＋名字）在上、「Host（接待）」在下，直項逐列易讀
            const splitR = function(s){ return String(s||'').split('·').map(function(x){ return x.trim(); }).filter(Boolean); };
            const withRole = people.filter(function(p){ return p.role !== 'Host'; });
            const hosts = people.filter(function(p){ return p.role === 'Host'; });
            withRole.sort(function(a, b){ // Manager 排最前
              return (a.role.indexOf('Manager') >= 0 ? 0 : 1) - (b.role.indexOf('Manager') >= 0 ? 0 : 1);
            });
            if (withRole.length) {
              h += '<div style="font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.5px;margin:2px 0 3px">已排定</div>';
              withRole.forEach(function(p){
                let badges = '';
                splitR(p.role).forEach(function(rr){ badges += '<span style="background:var(--teal);color:#FFF;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;flex-shrink:0">' + esc(rr) + '</span>'; });
                h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:#F2F8F7;margin-bottom:3px;flex-wrap:wrap">' + badges + '<span style="font-size:13px;font-weight:600">' + esc(p.name) + '</span></div>';
              });
            }
            if (hosts.length) {
              h += '<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:' + (withRole.length ? '9px' : '2px') + ' 0 3px">Host（接待）</div>';
              hosts.forEach(function(p){
                h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 8px"><span style="font-size:13px;font-weight:600">' + esc(p.name) + '</span><span style="color:var(--muted);font-size:12px">Host</span></div>';
              });
            }
          }
          h += '</div>';
        });
        h += '</div>';
      });
      h += '</div>'; // close .sched-two-col
      return h;
    }

    // 純本機過濾（名單已載入），每個 input 事件都即時反應；
    // 不再依賴 isComposing/compositionend 時機，修掉部分輸入法搜尋不觸發的問題
    function schedACSearch(val) {
      schedACInput = String(val || '');
      _schedRenderResults_();
    }

    function schedSelectPerson(rowIndex, name) {
      schedPersonRow = rowIndex; schedPersonName = name;
      schedACInput = ''; schedACResults = []; schedViewData = null; schedLocalEntries = {}; schedSubView = 'fill';
      localStorage.setItem('schedPersonRow', rowIndex); localStorage.setItem('schedPersonName', name);
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedClearPerson() {
      schedPersonRow = 0; schedPersonName = ''; schedViewData = null; schedLocalEntries = {};
      localStorage.removeItem('schedPersonRow'); localStorage.removeItem('schedPersonName');
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedSwitchView(v) {
      schedSubView = v;
      if (v !== 'overview') schedStopOverviewPoll(); // 離開總覽停止自動同步
      renderScheduleTab(document.getElementById('mainContent'));
      if (v === 'staff' && !schedStaffList && !schedStaffLoading) schedLoadStaff();
      if (v === 'overview' && !schedOverviewData && !schedOverviewLoading) schedLoadOverview();
      else if (v === 'overview') schedStartOverviewPoll(); // 已有快取也要恢復輪詢
      if (v === 'roster' && !schedRosterData && !schedRosterLoading) schedLoadRoster();
    }

    function schedToggleWeek() { schedCollapseFilled = !schedCollapseFilled; renderScheduleTab(document.getElementById('mainContent')); }

    function schedGroupByWeek(slots) {
      const weeks = []; let lastDate = null; let cur = null;
      slots.forEach(function(s) {
        if (s.date !== lastDate) { cur = { date: s.date, slots: [] }; weeks.push(cur); lastDate = s.date; }
        cur.slots.push(s);
      });
      return weeks;
    }

    function schedFmtDate(d) { const p = d.split('-'); return p.length < 3 ? d : parseInt(p[1]) + '/' + parseInt(p[2]); }

    function schedGetWeekRoles(week) {
      for (let i = 0; i < week.slots.length; i++) {
        const e = schedLocalEntries[week.slots[i].date + '|' + week.slots[i].session];
        if (e && e.status === 'available' && e.roles && e.roles.length > 0) return e.roles;
      }
      return [];
    }

    function schedChipClick(date, session) {
      // 排班已發布 → 不直接覆蓋，改走「申請調整」（點 4）
      if (schedViewData && schedViewData.period && schedViewData.period.published) {
        schedRequestChange(date, session);
        return;
      }
      const key = date + '|' + session;
      const cur = schedLocalEntries[key] || {};
      let newStatus;
      if (!cur.status) {
        newStatus = 'available';       // 未填 → 可服事
      } else if (cur.status === 'available') {
        newStatus = 'unavailable_all'; // 可服事 → 休息
      } else {
        newStatus = 'available';       // 休息 → 可服事
      }
      const newRoles = newStatus === 'available' ? (cur.roles || []) : [];
      schedLocalEntries[key] = Object.assign({}, cur, { status: newStatus, roles: newRoles });
      renderScheduleTab(document.getElementById('mainContent'));
      schedQueueSubmit(date, session, newStatus, newRoles);
    }

    function schedToggleRole(date, session, role) {
      // 排班已發布 → 角色也不直接改，走「申請調整」（點 4）
      if (schedViewData && schedViewData.period && schedViewData.period.published) {
        schedRequestChange(date, session);
        return;
      }
      // 角色現在 per slot（date+session），不再 per week
      const key = date + '|' + session;
      const e = schedLocalEntries[key];
      if (!e || e.status !== 'available') return;
      const curRoles = (e.roles || []).slice();
      const idx = curRoles.indexOf(role);
      if (idx >= 0) curRoles.splice(idx, 1); else curRoles.push(role);
      schedLocalEntries[key] = Object.assign({}, e, { roles: curRoles });
      schedQueueSubmit(date, session, 'available', curRoles);
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedToggleFixedSession(session) {
      if (!schedMyFixedSessions) schedMyFixedSessions = [];
      const idx = schedMyFixedSessions.indexOf(session);
      if (idx >= 0) schedMyFixedSessions.splice(idx, 1); else schedMyFixedSessions.push(session);
      localStorage.setItem('schedMyFixedSessions', JSON.stringify(schedMyFixedSessions));
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedToggleFixedRole(role) {
      const idx = schedMyFixedRoles.indexOf(role);
      if (idx >= 0) schedMyFixedRoles.splice(idx, 1); else schedMyFixedRoles.push(role);
      localStorage.setItem('schedMyFixedRoles', JSON.stringify(schedMyFixedRoles));
      // 同步更新所有已勾選場次的角色
      Object.keys(schedLocalEntries).forEach(function(k) {
        const e = schedLocalEntries[k];
        if (e && e.status === 'available') {
          schedLocalEntries[k] = Object.assign({}, e, { roles: schedMyFixedRoles.slice() });
          const parts = k.split('|');
          schedQueueSubmit(parts[0], parts[1], 'available', schedMyFixedRoles.slice());
        }
      });
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedCompleteFill() {
      const availCount = Object.keys(schedLocalEntries).filter(function(k) { const e = schedLocalEntries[k]; return e && (e.status === 'available' || e.status === 'assigned'); }).length;
      const rerender = function() { renderScheduleTab(document.getElementById('mainContent')); };
      const finish = function() {
        schedSubmitState = 'done'; schedRosterData = null; rerender();
        showToast(availCount ? '已送出 ✓ 共 ' + availCount + ' 個場次可服事' : '已送出 ✓');
        setTimeout(function() { schedSubmitState = ''; rerender(); }, 1800);
      };
      // 把還在 debounce 佇列裡的意願立刻 flush，確認＝真的存好了
      if (schedBatchTimer) clearTimeout(schedBatchTimer);
      const batch = Object.values(schedPending); schedPending = {};
      if (batch.length) {
        schedSubmitState = 'sending'; rerender();
        google.script.run
          .withSuccessHandler(function() { finish(); })
          .withFailureHandler(function(e) { schedSubmitState = ''; rerender(); showToast('送出失敗: ' + (e.message||e)); })
          .batchSubmitScheduleEntries(batch, null);
      } else {
        finish();
      }
    }

    function schedUnavailableAll() {
      if (!confirm('確定本期全部都不能服事嗎？')) return;
      const period = schedViewData && schedViewData.period;
      if (!period) { showToast('找不到期別'); return; }
      showLoading();
      google.script.run
        .withSuccessHandler(function(r) {
          hideLoading();
          if (r && r.success) { showToast('已送出：本期都不能服事'); schedViewData = null; schedLocalEntries = {}; schedRosterData = null; schedLoadView(); }
          else showToast('送出失敗，請重試');
        })
        .withFailureHandler(function(e) { hideLoading(); showToast('錯誤: ' + (e.message||e)); })
        .submitUnavailableAll(period.periodId, schedPersonRow, null);
    }

    function schedQueueSubmit(date, session, status, roles) {
      const period = schedViewData && schedViewData.period; if (!period) return;
      const key = date + '|' + session;
      schedPending[key] = { periodId: period.periodId, personRowIndex: schedPersonRow, date: date, session: session, status: status || 'available', roles: roles || [], note: '' };
      clearTimeout(schedBatchTimer);
      schedBatchTimer = setTimeout(function() {
        const batch = Object.values(schedPending); schedPending = {};
        if (!batch.length) return;
        // 一次送整批（後端 batchSubmitScheduleEntries 只讀表一次，取代每筆各打一次）
        google.script.run
          .withSuccessHandler(function() { schedRosterData = null; }) // 自己改了意願 → 失效「一起服事」名冊快取，下次開該頁重抓
          .withFailureHandler(function(e) { showToast('排班儲存失敗: ' + (e.message||e)); })
          .batchSubmitScheduleEntries(batch, null);
      }, 500);
    }

    // 排班已發布後，夥伴申請調整某場次（不直接覆蓋 Final，送 change_requested 給管理者）
    function schedRequestChange(date, session) {
      const period = schedViewData && schedViewData.period; if (!period) return;
      const reason = prompt('排班已發布。要向管理者申請調整「' + schedFmtDate(date) + '（日）' + session + '」嗎？\n請簡短說明原因（例：臨時有事、想換場次）：');
      if (reason === null) return;        // 按取消
      const trimmed = String(reason).trim();
      if (!trimmed) { showToast('請填寫調整原因'); return; }
      const key = date + '|' + session;
      const cur = schedLocalEntries[key] || {};
      schedLocalEntries[key] = Object.assign({}, cur, { status: 'change_requested', note: trimmed });
      renderScheduleTab(document.getElementById('mainContent'));
      google.script.run
        .withSuccessHandler(function() { schedRosterData = null; showToast('已送出調整申請，管理者會再跟你確認 ✓'); })
        .withFailureHandler(function(e) { showToast('送出失敗: ' + (e.message||e)); })
        .submitScheduleEntry({ periodId: period.periodId, personRowIndex: schedPersonRow, date: date, session: session, status: 'change_requested', roles: cur.roles || [], note: trimmed }, null);
    }

    // ============================================================
    // === Admin 總覽 ===
    // ============================================================

    function schedLoadOverview() {
      if (!isAdmin) return;
      schedOverviewLoading = true; schedOverviewData = null; schedUnfilledData = null;
      renderScheduleTab(document.getElementById('mainContent'));
      // 單一 GAS 呼叫取得所有資料（避免巢狀 google.script.run 靜默失敗問題）
      google.script.run
        .withSuccessHandler(function(d) {
          schedOverviewLoading = false;
          if (d && d.success) {
            schedOverviewData = { success: true, period: d.period, slots: d.slots, grid: d.grid, counts: d.counts || {}, staffSessions: d.staffSessions || {} };
            schedUnfilledData = { success: true, unfilled: d.unfilled };
            schedOverviewSig = JSON.stringify({ g: d.grid, c: d.counts, u: d.unfilled });
            schedStartOverviewPoll();
          } else {
            schedOverviewData = { period: null, slots: [], grid: {} };
            schedUnfilledData = { unfilled: [] };
          }
          renderScheduleTab(document.getElementById('mainContent'));
        })
        .withFailureHandler(function(e) {
          schedOverviewLoading = false;
          schedOverviewData = null;
          renderScheduleTab(document.getElementById('mainContent'));
          showToast('載入總覽失敗: ' + (e && e.message ? e.message : '未知錯誤'));
        })
        .getAdminOverviewAll();
    }

    function schedOverviewSwitchView(v) {
      schedOverviewSubView = v;
      renderScheduleTab(document.getElementById('mainContent'));
    }

    function schedOverviewRefresh() {
      schedOverviewData = null; schedUnfilledData = null;
      schedLoadOverview();
    }

    // ── 自動同步：admin 停在「總覽」時定期靜默重抓，讓其他 admin 的更新自動出現（不必手動重新整理）──
    function schedStartOverviewPoll() {
      if (schedOverviewPollTimer) return;
      schedOverviewPollTimer = setInterval(schedPollOverview_, 20000); // 每 20 秒
    }
    function schedStopOverviewPoll() {
      if (schedOverviewPollTimer) { clearInterval(schedOverviewPollTimer); schedOverviewPollTimer = null; }
    }
    function schedPollOverview_() {
      // 不在總覽 / 非 admin → 停掉
      if (!isAdmin || !adminToken || activeTab !== 'schedule' || schedSubView !== 'overview') { schedStopOverviewPoll(); return; }
      if (document.hidden) return;                          // 背景分頁不打 API
      if (schedOverviewLoading) return;
      const modal = document.getElementById('schedAssignModal');
      if (modal && modal.style.display === 'flex') return;  // 指派視窗開著不打擾
      if (Date.now() - schedLastLocalEditTs < 8000) return; // 自己剛編輯，先讓寫入沉澱再同步
      google.script.run
        .withSuccessHandler(function(d) {
          if (!d || !d.success) return;
          // 二次確認：回來時仍在總覽、無 modal、非剛編輯，才套用
          if (activeTab !== 'schedule' || schedSubView !== 'overview') return;
          const m = document.getElementById('schedAssignModal');
          if (m && m.style.display === 'flex') return;
          if (Date.now() - schedLastLocalEditTs < 8000) return;
          const sig = JSON.stringify({ g: d.grid, c: d.counts, u: d.unfilled });
          if (sig === schedOverviewSig) return;             // 沒變就不重繪（避免捲動位置跳動）
          schedOverviewSig = sig;
          schedOverviewData = { success: true, period: d.period, slots: d.slots, grid: d.grid, counts: d.counts || {}, staffSessions: d.staffSessions || {} };
          schedUnfilledData = { success: true, unfilled: d.unfilled };
          renderScheduleTab(document.getElementById('mainContent'));
        })
        .withFailureHandler(function() {})
        .getAdminOverviewAll();
    }

    // 發布 / 取消發布 Final 排班（點 4）
    function schedTogglePublish(publish) {
      const period = schedOverviewData && schedOverviewData.period;
      if (!period || !adminToken) { showToast('請先登入 Admin'); return; }
      const msg = publish
        ? '確定發布 Final 排班嗎？\n發布後夥伴端不能直接改，只能送「申請調整」給你。'
        : '確定取消發布嗎？\n夥伴端會恢復自由填寫。';
      if (!confirm(msg)) return;
      showLoading();
      const fn = publish ? 'publishPeriod' : 'unpublishPeriod';
      google.script.run
        .withSuccessHandler(function(r) {
          hideLoading();
          if (r && r.success) {
            showToast(publish ? '已發布 Final 排班 ✓' : '已取消發布');
            schedOverviewData = null; schedUnfilledData = null; schedLoadOverview();
          } else { showToast((r && r.error) || '操作失敗'); }
        })
        .withFailureHandler(function(e) { hideLoading(); showToast('錯誤: ' + (e.message||e)); })
        [fn](period.periodId, adminToken);
    }

    function renderSchedAdminOverview() {
      if (schedOverviewLoading) return '<div style="text-align:center;padding:40px;color:var(--muted)">載入中…</div>';
      if (!schedOverviewData) return '<div style="text-align:center;padding:40px;color:var(--muted)">載入失敗 <button onclick="schedOverviewRefresh()" style="margin-left:8px;background:none;border:1.5px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--teal)">重試</button></div>';
      if (!schedOverviewData.period) return '<div class="card" style="text-align:center;color:var(--muted);padding:32px">目前沒有開放的排班期別</div>';
      const period = schedOverviewData.period;
      let h = '';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">';
      h += '<div style="font-size:12px;color:var(--muted)">' + period.startDate + ' — ' + period.endDate + '</div>';
      h += '<button onclick="schedOverviewRefresh()" style="background:none;border:1.5px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer">重新整理</button>';
      h += '</div>';
      // ── 發布狀態 + 發布／取消發布（點 4：發布後夥伴端改動走申請調整）──
      if (period.published) {
        h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E8F5E9;border:1.5px solid #A5D6A7;border-radius:10px;padding:9px 12px;margin-bottom:12px">';
        h += '<div style="font-size:12px;color:#2E7D32;font-weight:700">✓ 已發布｜夥伴改動會走「申請調整」</div>';
        h += '<button onclick="schedTogglePublish(false)" style="background:none;border:1.5px solid #A5D6A7;border-radius:6px;padding:3px 10px;font-size:12px;color:#2E7D32;cursor:pointer;white-space:nowrap">取消發布</button>';
        h += '</div>';
      } else {
        h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFF8E1;border:1.5px solid #FCE588;border-radius:10px;padding:9px 12px;margin-bottom:12px">';
        h += '<div style="font-size:12px;color:#7A6320">尚未發布｜夥伴可自由填寫意願</div>';
        h += '<button onclick="schedTogglePublish(true)" style="background:var(--teal);border:none;border-radius:6px;padding:5px 12px;font-size:12px;color:#FFF;font-weight:700;cursor:pointer;white-space:nowrap">發布 Final 排班</button>';
        h += '</div>';
      }
      const ovTabs = [{ key:'status', label:'填寫狀況' }, { key:'grid', label:'排班 grid' }];
      h += '<div style="display:flex;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden">';
      ovTabs.forEach(function(t, i) {
        const active = schedOverviewSubView === t.key;
        const border = i < ovTabs.length-1 ? 'border-right:1.5px solid var(--border);' : '';
        h += '<button onclick="schedOverviewSwitchView(\'' + t.key + '\')" style="flex:1;padding:10px;border:none;' + border + 'font-size:14px;font-weight:' + (active?'700':'400') + ';background:' + (active?'var(--black)':'#FFF') + ';color:' + (active?'var(--yellow)':'var(--muted)') + ';cursor:pointer">' + t.label + '</button>';
      });
      h += '</div>';
      if (schedOverviewSubView === 'status') return h + renderSchedFillStatus_();
      if (schedOverviewSubView === 'grid') return h + renderSchedAdminGrid_();
      return h;
    }

    function renderSchedFillStatus_() {
      const grid = schedOverviewData.grid || {};
      const staffSessions = schedOverviewData.staffSessions || {};
      const personMap = {};
      Object.values(grid).forEach(function(cells) {
        cells.forEach(function(c) {
          if (!personMap[c.personRowIndex]) personMap[c.personRowIndex] = { name: c.name, home: c.homeSession || staffSessions[c.personRowIndex] || '', hasAvailable: false, hasUnavailable: false, hasChangeReq: false };
          if (c.status === 'available' || c.status === 'assigned') personMap[c.personRowIndex].hasAvailable = true;
          else if (c.status === 'unavailable_all') personMap[c.personRowIndex].hasUnavailable = true;
          if (c.status === 'change_requested') personMap[c.personRowIndex].hasChangeReq = true;
        });
      });
      // 整合所有人（含未填）→ {name, home, status, changeReq}
      let people = [];
      Object.values(personMap).forEach(function(p) {
        const status = p.hasAvailable ? 'filled' : (p.hasUnavailable ? 'unavailable' : 'filled');
        people.push({ name: p.name, home: p.home || '未分場', status: status, changeReq: p.hasChangeReq });
      });
      if (schedUnfilledData && schedUnfilledData.unfilled) {
        schedUnfilledData.unfilled.forEach(function(u) { people.push({ name: u.name, home: u.homeSession || '未分場', status: 'unfilled', changeReq: false }); });
      }
      // 場次焦點過濾：只看該場（跨場者也納入，因為他也服事這場）
      if (schedSessionFocus !== '全部') people = people.filter(function(p){ return p.home === schedSessionFocus || p.home === '跨場'; });
      const changeReq = people.filter(function(p){ return p.changeReq; }).map(function(p){ return p.name; });
      const filledN = people.filter(function(p){return p.status==='filled';}).length;
      const unavailN = people.filter(function(p){return p.status==='unavailable';}).length;
      const unfilledN = people.filter(function(p){return p.status==='unfilled';}).length;
      let h = '';
      h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
      h += '<div style="background:#E8F5E9;border-radius:10px;padding:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:#2E7D32">' + filledN + '</div><div style="font-size:11px;color:#2E7D32">已填</div></div>';
      h += '<div style="background:#ECEFF1;border-radius:10px;padding:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:#546E7A">' + unavailN + '</div><div style="font-size:11px;color:#546E7A">整期不能</div></div>';
      h += '<div style="background:#FFF8E1;border-radius:10px;padding:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:#F57F17">' + unfilledN + '</div><div style="font-size:11px;color:#F57F17">未填</div></div>';
      h += '</div>';
      if (changeReq.length > 0) {
        h += '<div style="background:#FFF4E0;border:1.5px solid #F0B860;border-radius:10px;padding:11px 14px;margin-bottom:14px"><div style="font-size:13px;font-weight:700;color:#B26A00;margin-bottom:3px">⚠ ' + changeReq.length + ' 人申請調整</div><div style="font-size:12px;color:#8A5A12">' + changeReq.map(function(n){return esc(n);}).join('、') + '</div><div style="font-size:11px;color:#A06A20;margin-top:4px">到「排班 grid」看橘色「申請調整」標記，原因在備註。</div></div>';
      }
      if (!people.length) return h + '<div class="card" style="text-align:center;color:var(--muted);padding:24px">尚無服事夥伴資料</div>';

      // ── 依場次分組顯示誰已填／未填（#1）──
      const _qaU_ = function(v){ return JSON.stringify(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
      const sortName = function(a, b){ return a.name.localeCompare(b.name, 'zh-TW'); };
      ['9:30','11:30','2:00','跨場','未分場'].forEach(function(sessName) {
        const group = people.filter(function(p){ return p.home === sessName; }).sort(sortName);
        if (!group.length) return;
        const gUnfilled = group.filter(function(p){ return p.status==='unfilled'; });
        h += '<div style="margin-bottom:14px">';
        h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="font-size:14px;font-weight:700;color:var(--teal)">' + sessName + '</div><span style="font-size:11px;color:var(--muted)">已填 ' + group.filter(function(p){return p.status==='filled';}).length + ' · 未填 ' + gUnfilled.length + '</span>';
        if (gUnfilled.length) {
          h += '<button onclick="schedCopyUnfilled(' + _qaU_(gUnfilled.map(function(p){return p.name;})) + ')" style="margin-left:auto;background:#FFF8E1;border:1.5px solid #F57F17;border-radius:6px;padding:3px 9px;font-size:11px;color:#F57F17;font-weight:700;cursor:pointer">複製未填 ' + gUnfilled.length + '</button>';
        }
        h += '</div>';
        h += '<div class="card" style="padding:0;overflow:hidden">';
        group.forEach(function(p, i) {
          const border = i < group.length-1 ? 'border-bottom:1px solid var(--border);' : '';
          let badge;
          if (p.status === 'filled') badge = '<span style="background:#E8F5E9;color:#2E7D32;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">已填</span>';
          else if (p.status === 'unavailable') badge = '<span style="background:#ECEFF1;color:#546E7A;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">整期不能</span>';
          else badge = '<span style="background:#FFF8E1;color:#F57F17;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">未填</span>';
          const crFlag = p.changeReq ? '<span style="background:#FFF4E0;color:#B26A00;border:1px solid #F0B860;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;margin-right:6px">申請調整</span>' : '';
          h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;' + border + '">';
          h += '<div style="font-size:14px;font-weight:600">' + esc(p.name) + '</div><div style="display:flex;align-items:center">' + crFlag + badge + '</div>';
          h += '</div>';
        });
        h += '</div></div>';
      });
      return h;
    }

    function renderSchedAdminGrid_() {
      const grid = schedOverviewData.grid || {};
      const slots = schedOverviewData.slots || [];
      const counts = schedOverviewData.counts || {};
      const period = schedOverviewData.period;
      const roles = (period && period.openableRoles) ? period.openableRoles : ['IT', 'Rally', '主持'];
      const byDate = {};
      slots.forEach(function(s) {
        if (!byDate[s.date]) byDate[s.date] = [];
        byDate[s.date].push(s.session);
      });
      const dayNames = ['日','一','二','三','四','五','六'];
      let h = '';
      const dates = Object.keys(byDate).sort();
      if (!dates.length) return '<div class="card" style="text-align:center;color:var(--muted);padding:24px">本期尚無排班 slot</div>';
      // 意願 vs Final 圖例（點 3）
      h += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FDFCF9;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--muted)">';
      h += '<span style="display:inline-flex;align-items:center;gap:4px"><span style="background:#E8F5E9;color:#2E7D32;border-radius:4px;padding:1px 6px">意願</span>夥伴自己勾的</span>';
      h += '<span style="display:inline-flex;align-items:center;gap:4px"><span style="background:var(--teal);color:#FFF;border-radius:4px;padding:1px 6px">✓ Final</span>你最終指派的</span>';
      h += '<span style="display:inline-flex;align-items:center;gap:4px"><span style="background:#FFF;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:1px 6px">Host</span>預設接待</span>';
      h += '</div>';
      h += '<div class="sched-two-col">';
      dates.forEach(function(date) {
        const sessions = byDate[date].filter(function(s){ return schedSessionFocus === '全部' || s === schedSessionFocus; });
        if (!sessions.length) return; // 場次焦點過濾：此主日沒有焦點場次就不顯示
        const d = date.split('-');
        const dateLabel = parseInt(d[1]) + '/' + parseInt(d[2]);
        const dayOfWeek = dayNames[new Date(date + 'T00:00:00').getDay()];
        h += '<div style="margin-bottom:10px;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)">';
        h += '<div style="background:var(--black);color:var(--yellow);font-size:13px;font-weight:700;padding:9px 14px">' + dateLabel + '（' + dayOfWeek + '）</div>';
        sessions.forEach(function(sess, si) {
          const key = date + '|' + sess;
          const cells = grid[key] || [];
          const available = cells.filter(function(c) { return c.status === 'available' || c.status === 'assigned'; });
          const changeReqCells = cells.filter(function(c) { return c.status === 'change_requested'; });
          const cnt = (counts[key] || { available: available.length, assigned: 0, changeRequested: changeReqCells.length });
          const border = si < sessions.length-1 ? 'border-bottom:1px solid var(--border);' : '';
          h += '<div style="padding:10px 14px;background:#FFF;' + border + '">';
          // 場次標頭 + 人數徽章（點 8）
          h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">';
          h += '<span style="font-size:12px;font-weight:700;color:var(--muted)">' + sess + '</span>';
          h += '<span style="background:var(--yellow);color:var(--black);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700">可服事 ' + cnt.available + '</span>';
          if (cnt.changeRequested) h += '<span style="background:#FFF4E0;color:#B26A00;border:1px solid #F0B860;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700">申請調整 ' + cnt.changeRequested + '</span>';
          h += '</div>';

          // 去重（同人同場可能有多列）→ 合併意願、取 adminRole
          const merged = {};
          available.forEach(function(c) {
            const k = c.personRowIndex;
            if (!merged[k]) merged[k] = { personRowIndex: k, name: c.name, roles: [], adminRole: '' };
            (c.roles || []).forEach(function(r){ if (r && merged[k].roles.indexOf(r) < 0) merged[k].roles.push(r); });
            if (c.adminRole && !merged[k].adminRole) merged[k].adminRole = c.adminRole;
          });
          const list = Object.keys(merged).map(function(k){ return merged[k]; });
          const assignedList = list.filter(function(p){ return p.adminRole; });
          const poolList = list.filter(function(p){ return !p.adminRole; })
            .sort(function(a, b){ return (b.roles.length>0?1:0) - (a.roles.length>0?1:0); }); // 有意願者優先

          const _qa_ = function(v){ return JSON.stringify(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
          const encRoles = _qa_(roles), encDate = _qa_(date), encSess = _qa_(sess);
          const personRow_ = function(p, isAssigned) {
            const tap = 'onclick="schedOpenAssign(' + p.personRowIndex + ',' + _qa_(p.name) + ',' + encDate + ',' + encSess + ',' + encRoles + ',' + _qa_(p.adminRole || '') + ')"';
            let inner;
            if (isAssigned) {
              inner = '';
              _splitRoles_(p.adminRole).forEach(function(rr){
                inner += '<span style="background:var(--teal);color:#FFF;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;text-align:center;flex-shrink:0">' + esc(rr) + '</span>';
              });
              inner += '<span style="font-size:13px;font-weight:600">' + esc(p.name) + '</span>';
            } else {
              inner = '<span style="font-size:13px;font-weight:600">' + esc(p.name) + '</span>';
              if (p.roles.length) p.roles.forEach(function(r){ inner += '<span style="background:#E8F5E9;color:#2E7D32;border-radius:4px;padding:1px 6px;font-size:11px">' + esc(r) + '</span>'; });
              else inner += '<span style="color:var(--muted);font-size:12px">Host</span>';
            }
            return '<div ' + tap + ' style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;flex-wrap:wrap;' + (isAssigned?'background:#F2F8F7;margin-bottom:3px;':'') + '">' + inner + '<span style="margin-left:auto;color:#CBD5D3;font-size:15px">›</span></div>';
          };

          if (!list.length) {
            h += '<div style="font-size:13px;color:#BDBDBD;font-style:italic">無人</div>';
          } else {
            if (assignedList.length) {
              h += '<div style="font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.5px;margin:2px 0 3px">已排定</div>';
              assignedList.forEach(function(p){ h += personRow_(p, true); });
            }
            if (poolList.length) {
              h += '<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:' + (assignedList.length?'9px':'2px') + ' 0 3px">Host（接待）</div>';
              poolList.forEach(function(p){ h += personRow_(p, false); });
            }
          }
          // 申請調整（橘）：顯示名字 + 原因 + 處理鈕（點 4）
          if (changeReqCells.length) {
            function _qb_(v){ return JSON.stringify(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
            changeReqCells.forEach(function(c) {
              h += '<div style="display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-top:1px dashed #F0B860;flex-wrap:wrap;background:#FFFBF2">';
              h += '<span style="background:#FFF4E0;color:#B26A00;border:1px solid #F0B860;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700">申請調整</span>';
              h += '<span style="font-size:13px;font-weight:600">' + esc(c.name) + '</span>';
              if (c.note) h += '<span style="font-size:12px;color:#8A5A12;flex-basis:100%;padding-left:2px">「' + esc(c.note) + '」</span>';
              h += '<button onclick="schedOpenAssign(' + c.personRowIndex + ',' + _qb_(c.name) + ',' + _qb_(date) + ',' + _qb_(sess) + ',' + _qb_(roles) + ',' + _qb_(c.adminRole || '') + ')" style="margin-left:auto;background:none;border:1.5px solid #F0B860;border-radius:6px;padding:2px 8px;font-size:11px;color:#B26A00;cursor:pointer">處理</button>';
              h += '</div>';
            });
          }
          h += '</div>';
        });
        h += '</div>';
      });
      h += '</div>'; // close .sched-two-col
      return h;
    }

    function schedCopyUnfilled(names) {
      const text = names.join('\n');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() { showToast('已複製 ' + names.length + ' 人名單'); }).catch(function() { _fallbackCopy_(text); });
      } else { _fallbackCopy_(text); }
    }
    function _fallbackCopy_(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast('已複製名單');
    }

    // ============================================================
    // 常用連結（服事夥伴中央窗口）
    // 所有動態值均經 esc() HTML 轉義後組字串，沿用本檔既有渲染慣例。
    // ============================================================
    function lucide(name, size) {
      const P = {
        copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
        external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
        'check-circle': '<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>',
        camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>'
      };
      const s = size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '';
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + s + '>' + (P[name] || '') + '</svg>';
    }

    function loadLinks(force) {
      if (linksLoading) return;
      if (linksLoaded && !force) { if (activeTab === 'links') renderTab(); return; }
      linksLoading = true;
      google.script.run
        .withSuccessHandler(function(r) {
          linksLoading = false; linksLoaded = true;
          linksData = (r && r.success && r.links) ? r.links : [];
          if (activeTab === 'links') renderTab();
        })
        .withFailureHandler(function(e) {
          linksLoading = false; linksLoaded = true; linksData = [];
          if (activeTab === 'links') renderTab();
          showToast('連結載入失敗');
        })
        .getLinks();
    }

    function renderLinksTab(main) {
      main.replaceChildren();
      if (!linksLoaded) {
        if (!linksLoading) loadLinks();
        main.insertAdjacentHTML('beforeend', '<div class="card" style="text-align:center;color:var(--muted);padding:30px">載入連結中⋯</div>');
        return;
      }
      const links = linksData || [];
      const share = links.filter(function(l) { return l.group === 'share'; });
      const staff = links.filter(function(l) { return l.group === 'staff'; });
      let h = '';
      if (isAdmin) {
        h += '<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:16px">';
        h += '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:800">夥伴專用連結</div><div style="font-size:12px;color:var(--muted);margin-top:2px">含存取金鑰，傳給服事夥伴點開即可使用</div></div>';
        h += '<button class="link-btn primary" style="flex:0 0 auto;min-height:38px" onclick="linkCopyStaffUrl()">' + lucide('copy') + '複製</button>';
        h += '</div>';
      }
      h += _renderLinksSection_('share', '分享給家人', '點「複製分享」直接貼給會友', share);
      h += _renderLinksSection_('staff', '服事工具', '服事時點開即用', staff);
      main.insertAdjacentHTML('beforeend', h);
    }

    function linkOpenEditor(id, presetGroup) {
      const l = id ? _findLink_(id) : null;
      linkEditorId = id || null;
      linkEditorGroup = l ? l.group : (presetGroup || 'share');
      let modal = document.getElementById('linkEditorModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'linkEditorModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;display:flex;align-items:flex-end;justify-content:center';
        modal.onclick = function(e) { if (e.target === modal) modal.style.display = 'none'; };
        document.body.appendChild(modal);
      }
      const v = l || { subcategory: '', title: '', url: '', description: '', shareText: '' };
      modal.replaceChildren();
      modal.insertAdjacentHTML('beforeend', _buildLinkEditorHtml_(id, v, _existingSubcats_()));
      modal.style.display = 'flex';
      linkEditorSetGroup(linkEditorGroup);
    }

    function _renderLinksSection_(group, title, sub, items) {
      let h = '<div class="links-section">';
      h += '<div class="links-section-head"><div class="links-section-bar ' + (group === 'staff' ? 'staff' : '') + '"></div>';
      h += '<div class="links-section-title">' + esc(title) + '</div>';
      h += '<div class="links-section-sub">' + esc(sub) + '</div></div>';
      if (!items.length && !isAdmin) {
        h += '<div class="card" style="color:var(--muted);font-size:13px">尚未有連結</div>';
      } else if (items.length) {
        h += '<div class="links-grid">';
        items.forEach(function(l) { h += _renderLinkCard_(l); });
        h += '</div>';
      }
      if (isAdmin) {
        h += '<button class="link-add-btn" onclick="linkOpenEditor(null,\'' + group + '\')">' + lucide('plus') + '新增連結</button>';
      }
      h += '</div>';
      return h;
    }

    function _renderLinkCard_(l) {
      const safeId = esc(l.id);
      const url = esc(l.url);
      let h = '<div class="link-card">';
      if (isAdmin) {
        h += '<div class="link-admin">'
          + '<button onclick="linkOpenEditor(\'' + safeId + '\')" aria-label="編輯">' + lucide('edit') + '</button>'
          + '<button onclick="linkDelete(\'' + safeId + '\')" aria-label="刪除">' + lucide('trash') + '</button>'
          + '</div>';
      }
      if (l.subcategory) h += '<div class="link-chip">' + esc(l.subcategory) + '</div>';
      h += '<div class="link-title"' + (isAdmin ? ' style="padding-right:64px"' : '') + '>' + esc(l.title) + '</div>';
      if (l.description) h += '<div class="link-desc">' + esc(l.description) + '</div>';
      h += '<div class="link-actions">';
      if (l.group === 'share') {
        h += '<button class="link-btn primary" onclick="linkCopyShare(\'' + safeId + '\')">' + lucide('copy') + '複製分享</button>';
        h += '<a class="link-btn icon" href="' + url + '" target="_blank" rel="noopener" aria-label="開啟">' + lucide('external') + '</a>';
      } else {
        h += '<a class="link-btn primary" href="' + url + '" target="_blank" rel="noopener">' + lucide('external') + '開啟</a>';
        h += '<button class="link-btn icon" onclick="linkCopyUrl(\'' + safeId + '\')" aria-label="複製連結">' + lucide('copy') + '</button>';
      }
      h += '</div></div>';
      return h;
    }

    function _findLink_(id) { return (linksData || []).filter(function(l) { return l.id === id; })[0] || null; }

    // 複製含金鑰的夥伴專用連結（admin）
    function linkCopyStaffUrl() {
      if (!adminToken) { showToast('請先登入 Admin'); return; }
      google.script.run
        .withSuccessHandler(function(r) {
          if (r && r.success) linkCopy_(r.url, '已複製夥伴專用連結');
          else showToast((r && r.error) || '取得連結失敗');
        })
        .withFailureHandler(function(e) { showToast('錯誤: ' + (e.message||e)); })
        .getStaffAccessInfo(adminToken);
    }

    function linkCopyShare(id) {
      const l = _findLink_(id); if (!l) return;
      const t = (l.shareText && l.shareText.trim()) ? l.shareText : (l.title + '\n' + l.url);
      linkCopy_(t, '已複製，可貼給家人');
    }
    function linkCopyUrl(id) {
      const l = _findLink_(id); if (!l) return;
      linkCopy_(l.url, '已複製連結');
    }
    function linkCopy_(text, okMsg) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() { showToast(okMsg); }).catch(function() { _fallbackCopyMsg_(text, okMsg); });
      } else { _fallbackCopyMsg_(text, okMsg); }
    }
    function _fallbackCopyMsg_(text, okMsg) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast(okMsg || '已複製');
    }

    // === Admin 編輯 ===
    let linkEditorId = null;
    let linkEditorGroup = 'share';

    function _existingSubcats_() {
      const set = {};
      (linksData || []).forEach(function(l) { if (l.subcategory) set[l.subcategory] = 1; });
      return Object.keys(set);
    }
    function _linkField_(label, control) {
      return '<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px">' + label + '</div>' + control + '</div>';
    }

    function _buildLinkEditorHtml_(id, v, subcats) {
      let h = '<div style="background:#FDFCF9;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:540px;box-sizing:border-box;max-height:90vh;overflow-y:auto">';
      h += '<div style="width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px"></div>';
      h += '<div style="font-size:17px;font-weight:800;margin-bottom:16px">' + (id ? '編輯連結' : '新增連結') + '</div>';
      h += '<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px">分類</div>';
      h += '<div style="display:flex;gap:8px;margin-bottom:14px">'
        + '<button type="button" id="linkGrpShare" onclick="linkEditorSetGroup(\'share\')">會友分享</button>'
        + '<button type="button" id="linkGrpStaff" onclick="linkEditorSetGroup(\'staff\')">服事夥伴專屬</button>'
        + '</div>';
      h += _linkField_('子分類（選填）', '<input id="linkF_sub" class="input" list="dl-linksubcat" value="' + esc(v.subcategory) + '" placeholder="例：報名、表單、會議">');
      h += '<datalist id="dl-linksubcat">' + subcats.map(function(s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>';
      h += _linkField_('標題', '<input id="linkF_title" class="input" value="' + esc(v.title) + '" placeholder="連結名稱">');
      h += _linkField_('網址', '<input id="linkF_url" class="input" value="' + esc(v.url) + '" placeholder="https://" inputmode="url">');
      h += _linkField_('說明（服事夥伴看的，幫助理解這是什麼）', '<textarea id="linkF_desc" class="input" rows="2" style="resize:vertical">' + esc(v.description) + '</textarea>');
      h += _linkField_('複製分享內容（留空＝自動用 標題＋網址）', '<textarea id="linkF_share" class="input" rows="3" style="resize:vertical" placeholder="按「複製分享」時會複製這段文字給會友">' + esc(v.shareText) + '</textarea>');
      h += '<div style="display:flex;gap:10px;margin-top:8px">';
      h += '<button onclick="document.getElementById(\'linkEditorModal\').style.display=\'none\'" style="flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:#FFF;font-size:15px;font-weight:700;cursor:pointer">取消</button>';
      h += '<button onclick="linkSubmitEditor()" style="flex:1;padding:13px;border-radius:12px;border:none;background:var(--black);color:var(--yellow);font-size:15px;font-weight:700;cursor:pointer">' + (id ? '儲存' : '新增') + '</button>';
      h += '</div></div>';
      return h;
    }

    function linkEditorSetGroup(g) {
      linkEditorGroup = g;
      const s = document.getElementById('linkGrpShare');
      const t = document.getElementById('linkGrpStaff');
      if (!s || !t) return;
      const base = 'flex:1;padding:11px;border-radius:10px;border:1.5px solid;font-weight:700;cursor:pointer;';
      const on = 'border-color:var(--black);background:var(--black);color:var(--yellow)';
      const off = 'border-color:var(--border);background:#FFF;color:var(--black)';
      s.style.cssText = base + (g === 'share' ? on : off);
      t.style.cssText = base + (g === 'staff' ? on : off);
    }

    function linkSubmitEditor() {
      const title = document.getElementById('linkF_title').value.trim();
      const url = document.getElementById('linkF_url').value.trim();
      if (!title) { showToast('請填標題'); return; }
      if (!url) { showToast('請填網址'); return; }
      const payload = {
        group: linkEditorGroup,
        subcategory: document.getElementById('linkF_sub').value.trim(),
        title: title, url: url,
        description: document.getElementById('linkF_desc').value.trim(),
        shareText: document.getElementById('linkF_share').value
      };
      showLoading();
      const done = function(r) {
        hideLoading();
        if (r && r.success) {
          const m = document.getElementById('linkEditorModal'); if (m) m.style.display = 'none';
          showToast(linkEditorId ? '已儲存' : '已新增');
          loadLinks(true);
        } else {
          showToast((r && r.error) || '操作失敗');
        }
      };
      const fail = function(e) { hideLoading(); showToast('操作失敗：' + ((e && e.message) || '')); };
      if (linkEditorId) {
        google.script.run.withSuccessHandler(done).withFailureHandler(fail).updateLink(linkEditorId, payload, adminToken);
      } else {
        google.script.run.withSuccessHandler(done).withFailureHandler(fail).addLink(payload, adminToken);
      }
    }

    function linkDelete(id) {
      const l = _findLink_(id); if (!l) return;
      if (!confirm('確定刪除「' + l.title + '」?')) return;
      showLoading();
      google.script.run
        .withSuccessHandler(function(r) {
          hideLoading();
          if (r && r.success) { showToast('已刪除'); loadLinks(true); }
          else showToast((r && r.error) || '刪除失敗');
        })
        .withFailureHandler(function(e) { hideLoading(); showToast('刪除失敗'); })
        .deleteLink(id, adminToken);
    }

    // 把 adminRole 儲存字串（'IT·Rally'）拆回角色陣列
    function _splitRoles_(s) {
      return String(s || '').split('·').map(function(x){ return x.trim(); }).filter(Boolean);
    }

    // currentStr：此人此場目前已指派的角色（'IT·Rally'，可空）→ 多選 toggle，一人可同時多角色
    function schedOpenAssign(rowIndex, name, date, session, roles, currentStr) {
      let modal = document.getElementById('schedAssignModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'schedAssignModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;display:flex;align-items:flex-end;justify-content:center';
        modal.onclick = function(e) { if (e.target === modal) modal.style.display = 'none'; };
        document.body.appendChild(modal);
      }
      // 本機選取狀態（最後按「儲存指派」才一次送出）
      const selected = {};
      _splitRoles_(currentStr).forEach(function(r){ selected[r] = true; });

      const dateLabel = date.replace(/^\d+-?(\d+)-(\d+)$/, function(_,m,d){return parseInt(m)+'/'+parseInt(d);});
      const inner = document.createElement('div');
      inner.style.cssText = 'background:#FDFCF9;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;box-sizing:border-box';
      const handle = document.createElement('div');
      handle.style.cssText = 'width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px';
      inner.appendChild(handle);
      const nameEl = document.createElement('div');
      nameEl.style.cssText = 'font-size:15px;font-weight:700;margin-bottom:4px';
      nameEl.textContent = name;
      inner.appendChild(nameEl);
      const subEl = document.createElement('div');
      subEl.style.cssText = 'font-size:13px;color:var(--muted);margin-bottom:16px';
      subEl.textContent = dateLabel + ' ' + session;
      inner.appendChild(subEl);
      const labelEl = document.createElement('div');
      labelEl.style.cssText = 'font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px';
      labelEl.textContent = '指派角色（可複選）';
      inner.appendChild(labelEl);
      const hintEl = document.createElement('div');
      hintEl.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:10px';
      hintEl.textContent = '可同時指派多個角色，例如 IT＋Rally；再點一次取消選取。';
      inner.appendChild(hintEl);

      const chipOn  = function(b){ b.style.cssText = 'flex:1;min-width:72px;padding:12px;border:1.5px solid var(--teal);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--teal);color:#FFF'; };
      const chipOff = function(b){ b.style.cssText = 'flex:1;min-width:72px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#FFF;color:var(--black)'; };
      const btns = document.createElement('div');
      btns.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap';
      roles.forEach(function(r) {
        const btn = document.createElement('button');
        btn.textContent = r;
        (selected[r] ? chipOn : chipOff)(btn);
        btn.onclick = function() {
          if (selected[r]) delete selected[r]; else selected[r] = true;
          (selected[r] ? chipOn : chipOff)(btn);
        };
        btns.appendChild(btn);
      });
      inner.appendChild(btns);
      // Manager：只能由管理者指派（點 1），夥伴端看不到；也可與其他角色並存
      const mgrOn  = function(b){ b.style.cssText = 'width:100%;padding:12px;border:1.5px solid var(--teal);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--teal);color:#FFF;margin-bottom:12px'; };
      const mgrOff = function(b){ b.style.cssText = 'width:100%;padding:12px;border:1.5px solid var(--teal);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#FFF;color:var(--teal);margin-bottom:12px'; };
      const mgrBtn = document.createElement('button');
      mgrBtn.textContent = 'Manager（管理者專屬）';
      (selected['Manager'] ? mgrOn : mgrOff)(mgrBtn);
      mgrBtn.onclick = function() {
        if (selected['Manager']) delete selected['Manager']; else selected['Manager'] = true;
        (selected['Manager'] ? mgrOn : mgrOff)(mgrBtn);
      };
      inner.appendChild(mgrBtn);
      // 儲存指派（一次送出所有選取角色）
      const saveBtn = document.createElement('button');
      saveBtn.style.cssText = 'width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;background:var(--black);color:var(--yellow);margin-bottom:8px';
      saveBtn.textContent = '儲存指派';
      saveBtn.onclick = function() { schedAssignRolesAction(rowIndex, date, session, Object.keys(selected)); };
      inner.appendChild(saveBtn);
      const clearBtn = document.createElement('button');
      clearBtn.style.cssText = 'width:100%;padding:12px;border:1.5px solid #FFCDD2;border-radius:10px;font-size:14px;color:#C62828;background:#FFF;cursor:pointer;margin-bottom:8px';
      clearBtn.textContent = '清除指派（保留可服事）';
      clearBtn.onclick = function() { schedAssignRolesAction(rowIndex, date, session, []); };
      inner.appendChild(clearBtn);
      // 取消此人此場：標記不能服事，從名單移除（點 5）
      const cancelBtn = document.createElement('button');
      cancelBtn.style.cssText = 'width:100%;padding:12px;border:1.5px solid #E5998A;border-radius:10px;font-size:14px;color:#C05040;background:#FEF0ED;font-weight:600;cursor:pointer';
      cancelBtn.textContent = '取消此人此場（移出本場）';
      cancelBtn.onclick = function() { schedCancelAvailabilityAction(rowIndex, name, date, session); };
      inner.appendChild(cancelBtn);
      modal.replaceChildren(inner);
      modal.style.display = 'flex';
    }

    // 本機更新某格某人的狀態/角色（#3 樂觀更新用），並重算該格人數
    function schedApplyLocalCell_(date, session, rowIndex, patch) {
      if (!schedOverviewData || !schedOverviewData.grid) return;
      const key = date + '|' + session;
      const cells = schedOverviewData.grid[key];
      if (cells) {
        const cell = cells.find(function(c){ return c.personRowIndex === rowIndex; });
        if (cell) Object.assign(cell, patch);
      }
      // 重算 counts[key]
      let avail = 0, assigned = 0, changeReq = 0;
      (schedOverviewData.grid[key] || []).forEach(function(c) {
        const st = String(c.status || '');
        if (st === 'available' || st === 'assigned') avail++;
        if (c.adminRole) assigned++;
        if (st === 'change_requested') changeReq++;
      });
      if (!schedOverviewData.counts) schedOverviewData.counts = {};
      schedOverviewData.counts[key] = { available: avail, assigned: assigned, changeRequested: changeReq };
    }

    // 一次送出多個角色（rolesArr 可空＝清除指派）
    function schedAssignRolesAction(rowIndex, date, session, rolesArr) {
      const modal = document.getElementById('schedAssignModal');
      if (modal) modal.style.display = 'none';
      const period = schedOverviewData && schedOverviewData.period;
      if (!period || !adminToken) { showToast('請先登入 Admin'); return; }
      const roles = (rolesArr || []).filter(Boolean);
      const joined = roles.join('·');
      // 樂觀更新：就地改該格，不整頁重載，可連續快速指派（#3）
      schedApplyLocalCell_(date, session, rowIndex, { adminRole: joined, status: joined ? 'assigned' : 'available' });
      schedRosterData = null; // 失效「一起服事」名冊快取，下次開該頁重新抓（角色/移除即時反映）
      schedLastLocalEditTs = Date.now(); schedOverviewSig = ''; // 標記剛編輯，並讓下次 poll 必定套用最新
      renderScheduleTab(document.getElementById('mainContent'));
      showToast(joined ? '已指派：' + roles.join('、') : '已清除指派');
      google.script.run
        .withSuccessHandler(function(r) { if (!r || !r.success) { showToast((r && r.error) || '指派失敗，已重新整理'); schedOverviewRefresh(); } })
        .withFailureHandler(function(e) { showToast('錯誤，已重新整理: ' + (e.message||e)); schedOverviewRefresh(); })
        .adminAssignRole(period.periodId, rowIndex, date, session, roles, adminToken);
    }

    // 取消某人某場的可服事（點 5）
    function schedCancelAvailabilityAction(rowIndex, name, date, session) {
      const modal = document.getElementById('schedAssignModal');
      const period = schedOverviewData && schedOverviewData.period;
      if (!period || !adminToken) { showToast('請先登入 Admin'); return; }
      if (!confirm('確定把「' + name + '」移出 ' + session + ' 這場嗎？\n會標記為不能服事，從本場名單移除。')) return;
      if (modal) modal.style.display = 'none';
      // 樂觀更新：就地標記移除（#3）
      schedApplyLocalCell_(date, session, rowIndex, { status: 'admin_removed', adminRole: '', roles: [] });
      schedRosterData = null; // 失效「一起服事」名冊快取，下次開該頁重新抓（修 grid 與名冊不同步）
      schedLastLocalEditTs = Date.now(); schedOverviewSig = ''; // 標記剛編輯，並讓下次 poll 必定套用最新
      renderScheduleTab(document.getElementById('mainContent'));
      showToast('已將 ' + name + ' 移出本場');
      google.script.run
        .withSuccessHandler(function(r) { if (!r || !r.success) { showToast((r && r.error) || '操作失敗，已重新整理'); schedOverviewRefresh(); } })
        .withFailureHandler(function(e) { showToast('錯誤，已重新整理: ' + (e.message||e)); schedOverviewRefresh(); })
        .adminCancelAvailability(period.periodId, rowIndex, date, session, adminToken);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        renderNav();
        loadHistorical();
      });
    } else {
      renderNav();
      loadHistorical();
    }

    // 回到前景時，若 admin 正停在排班總覽，立即同步一次（手機切回 app / 切回分頁）
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && isAdmin && activeTab === 'schedule' && schedSubView === 'overview') {
        schedStartOverviewPoll();
        schedPollOverview_();
      }
    });
  </script>

</body>
</html>
